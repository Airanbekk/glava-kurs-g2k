<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Метод бурильщика: два этапа глушения</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<rect x="32.0" y="110" width="160.0" height="330" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="48.0" y="140" fill="#F1C40F" font-size="18" font-weight="700">Шаг 1</text>
<text x="48.0" y="168" fill="#ECEFF4" font-size="17">Включить насос,</text>
<text x="48.0" y="192" fill="#ECEFF4" font-size="17">открыть штуцер 5 и</text>
<text x="48.0" y="216" fill="#ECEFF4" font-size="17">вести давление в</text>
<text x="48.0" y="240" fill="#ECEFF4" font-size="17">кольцевом</text>
<text x="48.0" y="264" fill="#ECEFF4" font-size="17">пространстве к</text>
<text x="48.0" y="288" fill="#ECEFF4" font-size="17">значению закрытой</text>
<line x1="194.0" y1="275" x2="214.0" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="216.0" y="110" width="160.0" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="232.0" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 2</text>
<text x="232.0" y="168" fill="#ECEFF4" font-size="17">На скорости</text>
<text x="232.0" y="192" fill="#ECEFF4" font-size="17">глушения держать</text>
<text x="232.0" y="216" fill="#ECEFF4" font-size="17">давление в трубах</text>
<text x="232.0" y="240" fill="#ECEFF4" font-size="17">постоянным, пока</text>
<text x="232.0" y="264" fill="#ECEFF4" font-size="17">пачка флюида не</text>
<text x="232.0" y="288" fill="#ECEFF4" font-size="17">выйдет.</text>
<line x1="378.0" y1="275" x2="398.0" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="400.0" y="110" width="160.0" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="416.0" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 3</text>
<text x="416.0" y="168" fill="#ECEFF4" font-size="17">Остановить</text>
<text x="416.0" y="192" fill="#ECEFF4" font-size="17">циркуляцию,</text>
<text x="416.0" y="216" fill="#ECEFF4" font-size="17">выдержать скважину</text>
<text x="416.0" y="240" fill="#ECEFF4" font-size="17">для стабилизации</text>
<text x="416.0" y="264" fill="#ECEFF4" font-size="17">давления и</text>
<text x="416.0" y="288" fill="#ECEFF4" font-size="17">сравнить давления</text>
<line x1="562.0" y1="275" x2="582.0" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="584.0" y="110" width="160.0" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="600.0" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 4</text>
<text x="600.0" y="168" fill="#ECEFF4" font-size="17">Начать второй</text>
<text x="600.0" y="192" fill="#ECEFF4" font-size="17">этап: открыть</text>
<text x="600.0" y="216" fill="#ECEFF4" font-size="17">штуцер, включить</text>
<text x="600.0" y="240" fill="#ECEFF4" font-size="17">насос и держать</text>
<text x="600.0" y="264" fill="#ECEFF4" font-size="17">постоянное</text>
<text x="600.0" y="288" fill="#ECEFF4" font-size="17">давление в</text>
<line x1="746.0" y1="275" x2="766.0" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="768.0" y="110" width="160.0" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="784.0" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 5</text>
<text x="784.0" y="168" fill="#ECEFF4" font-size="17">На расчётной</text>
<text x="784.0" y="192" fill="#ECEFF4" font-size="17">скорости привести</text>
<text x="784.0" y="216" fill="#ECEFF4" font-size="17">давление в трубах</text>
<text x="784.0" y="240" fill="#ECEFF4" font-size="17">к давлению</text>
<text x="784.0" y="264" fill="#ECEFF4" font-size="17">закрытия плюс</text>
<text x="784.0" y="288" fill="#ECEFF4" font-size="17">потери на</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 316, 317</text>
</svg>