<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Свойства раствора как слабый сигнал</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<rect x="32" y="100" width="280" height="300" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="48" y="130" fill="#F1C40F" font-size="18" font-weight="700">Что измеряем</text>
<text x="48" y="158" fill="#ECEFF4" font-size="17">При поступлении пластового</text>
<text x="48" y="182" fill="#ECEFF4" font-size="17">флюида в ствол меняются</text>
<text x="48" y="206" fill="#ECEFF4" font-size="17">свойства бурового раствора.</text>
<line x1="316" y1="250" x2="346" y2="250" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="350" y="100" width="280" height="300" rx="14" fill="#1A2129" stroke="#2E8B57" stroke-width="3"/>
<text x="366" y="130" fill="#2E8B57" font-size="18" font-weight="700">Что выводим</text>
<text x="366" y="158" fill="#ECEFF4" font-size="17">Эти признаки значимы при слабых</text>
<text x="366" y="182" fill="#ECEFF4" font-size="17">проявлениях, когда приток долго</text>
<text x="366" y="206" fill="#ECEFF4" font-size="17">остаётся ниже разрешающей</text>
<text x="366" y="230" fill="#ECEFF4" font-size="17">способности установленных</text>
<text x="366" y="254" fill="#ECEFF4" font-size="17">средств распознавания.</text>
<line x1="634" y1="250" x2="664" y2="250" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="668" y="100" width="260" height="300" rx="14" fill="#1A2129" stroke="#95A5A6" stroke-width="3"/>
<text x="684" y="130" fill="#95A5A6" font-size="18" font-weight="700">При условии</text>
<text x="684" y="158" fill="#ECEFF4" font-size="17">Причиной отклонения могут</text>
<text x="684" y="182" fill="#ECEFF4" font-size="17">быть и другие факторы.</text>
<text x="684" y="206" fill="#ECEFF4" font-size="17">Информативность показателей</text>
<text x="684" y="230" fill="#ECEFF4" font-size="17">разная. Сигнал приходит с</text>
<text x="684" y="254" fill="#ECEFF4" font-size="17">лагом, равным времени подъёма</text>
<text x="684" y="278" fill="#ECEFF4" font-size="17">забойной пачки. Число порогов</text>
<text x="32" y="440" fill="#8A96A3" font-size="17">Измерение косвенное: один и тот же отклик могут дать разные пласты.</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 239</text>
</svg>