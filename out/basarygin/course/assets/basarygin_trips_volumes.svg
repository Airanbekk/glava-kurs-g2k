<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Баланс долива и вытеснения при СПО</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<rect x="32.0" y="110" width="282.6666666666667" height="330" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="48.0" y="140" fill="#F1C40F" font-size="18" font-weight="700">Шаг 1</text>
<text x="48.0" y="168" fill="#ECEFF4" font-size="17">Подъём: рассчитать контрольный</text>
<text x="48.0" y="192" fill="#ECEFF4" font-size="17">объём (металл плюс плёнка) и</text>
<text x="48.0" y="216" fill="#ECEFF4" font-size="17">сверять с фактическим доливом</text>
<text x="48.0" y="240" fill="#ECEFF4" font-size="17">по мерной ёмкости. Недолив</text>
<text x="48.0" y="264" fill="#ECEFF4" font-size="17">больше 1 м³ недопустим.</text>
<line x1="316.6666666666667" y1="275" x2="336.6666666666667" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="338.6666666666667" y="110" width="282.6666666666667" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="354.6666666666667" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 2</text>
<text x="354.6666666666667" y="168" fill="#ECEFF4" font-size="17">Спуск: отключить остальные</text>
<text x="354.6666666666667" y="192" fill="#ECEFF4" font-size="17">ёмкости от желобной системы и</text>
<text x="354.6666666666667" y="216" fill="#ECEFF4" font-size="17">следить за одной приёмной.</text>
<text x="354.6666666666667" y="240" fill="#ECEFF4" font-size="17">Сверять объём с контрольным</text>
<text x="354.6666666666667" y="264" fill="#ECEFF4" font-size="17">после каждых 10 свечей.</text>
<line x1="623.3333333333334" y1="275" x2="643.3333333333334" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="645.3333333333334" y="110" width="282.6666666666667" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="661.3333333333334" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 3</text>
<text x="661.3333333333334" y="168" fill="#ECEFF4" font-size="17">Рост объёма в приёмной ёмкости</text>
<text x="661.3333333333334" y="192" fill="#ECEFF4" font-size="17">на 1 м³ — начало проявления.</text>
<text x="661.3333333333334" y="216" fill="#ECEFF4" font-size="17">Если перелив не прекращается,</text>
<text x="661.3333333333334" y="240" fill="#ECEFF4" font-size="17">флюид уже поступает в ствол.</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 238, 239</text>
</svg>