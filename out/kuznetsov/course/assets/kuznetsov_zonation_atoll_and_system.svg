<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Кольцо атолла и линейная система</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<rect x="32" y="100" width="280" height="330" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="48" y="130" fill="#F1C40F" font-size="18" font-weight="700">Причина / механизм</text>
<text x="48" y="158" fill="#ECEFF4" font-size="17">Гребень из биогермных пород</text>
<text x="48" y="182" fill="#ECEFF4" font-size="17">возвышается и над дном</text>
<text x="48" y="206" fill="#ECEFF4" font-size="17">бассейна, и над лагуной.</text>
<text x="48" y="230" fill="#ECEFF4" font-size="17">Поэтому обломочный материал</text>
<text x="48" y="254" fill="#ECEFF4" font-size="17">сносится на обе стороны: наружу</text>
<text x="48" y="278" fill="#ECEFF4" font-size="17">на предрифовый склон, внутрь на</text>
<line x1="316" y1="265" x2="346" y2="265" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="350" y="100" width="280" height="330" rx="14" fill="#1A2129" stroke="#2E8B57" stroke-width="3"/>
<text x="366" y="130" fill="#2E8B57" font-size="18" font-weight="700">Следствие</text>
<text x="366" y="158" fill="#ECEFF4" font-size="17">В атолле ядро рифа образует</text>
<text x="366" y="182" fill="#ECEFF4" font-size="17">кольцо, а в центре лежат</text>
<text x="366" y="206" fill="#ECEFF4" font-size="17">лагунные фации. В линейной</text>
<text x="366" y="230" fill="#ECEFF4" font-size="17">системе зоны вытянуты вдоль</text>
<text x="366" y="254" fill="#ECEFF4" font-size="17">простирания и асимметричны: это</text>
<text x="366" y="278" fill="#ECEFF4" font-size="17">как бы половина профиля атолла.</text>
<line x1="634" y1="265" x2="664" y2="265" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="668" y="100" width="260" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="684" y="130" fill="#3498DB" font-size="18" font-weight="700">Как используют</text>
<text x="684" y="158" fill="#ECEFF4" font-size="17">Зная положение скважины в</text>
<text x="684" y="182" fill="#ECEFF4" font-size="17">профиле (бассейн, предрифовая</text>
<text x="684" y="206" fill="#ECEFF4" font-size="17">зона, ядро, тыл, лагуна),</text>
<text x="684" y="230" fill="#ECEFF4" font-size="17">можно ожидать тип породы. Для</text>
<text x="684" y="254" fill="#ECEFF4" font-size="17">атолла профиль повторяется по</text>
<text x="684" y="278" fill="#ECEFF4" font-size="17">кольцу, для линейной системы</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 203, 204</text>
</svg>