<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Коллекторы линейной рифовой системы</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<line x1="40" y1="470" x2="920" y2="470" stroke="#8A96A3" stroke-width="3" marker-end="url(#ah)"/>
<text x="800" y="500" fill="#8A96A3" font-size="16">время →</text>
<rect x="40.0" y="100" width="205.0" height="340" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="56.0" y="130" fill="#F1C40F" font-size="18" font-weight="700">Этап 1</text>
<text x="56.0" y="158" fill="#ECEFF4" font-size="17">Риф — это постройка из</text>
<text x="56.0" y="182" fill="#ECEFF4" font-size="17">организмов и их</text>
<text x="56.0" y="206" fill="#ECEFF4" font-size="17">остатков. Фация — тип</text>
<text x="56.0" y="230" fill="#ECEFF4" font-size="17">отложений, который</text>
<text x="56.0" y="254" fill="#ECEFF4" font-size="17">зависит от условий</text>
<text x="56.0" y="278" fill="#ECEFF4" font-size="17">накопления. В рифе</text>
<rect x="265.0" y="100" width="205.0" height="340" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="281.0" y="130" fill="#3498DB" font-size="18" font-weight="700">Этап 2</text>
<text x="281.0" y="158" fill="#ECEFF4" font-size="17">Автор говорит, что в</text>
<text x="281.0" y="182" fill="#ECEFF4" font-size="17">асимметричных системах</text>
<text x="281.0" y="206" fill="#ECEFF4" font-size="17">коллекторы связаны с</text>
<text x="281.0" y="230" fill="#ECEFF4" font-size="17">этой зональностью.</text>
<text x="281.0" y="254" fill="#ECEFF4" font-size="17">Поэтому и их</text>
<text x="281.0" y="278" fill="#ECEFF4" font-size="17">распределение</text>
<rect x="490.0" y="100" width="205.0" height="340" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="506.0" y="130" fill="#3498DB" font-size="18" font-weight="700">Этап 3</text>
<text x="506.0" y="158" fill="#ECEFF4" font-size="17">На Шуртане гребень рифа</text>
<text x="506.0" y="182" fill="#ECEFF4" font-size="17">смещался</text>
<text x="506.0" y="206" fill="#ECEFF4" font-size="17">последовательно во</text>
<text x="506.0" y="230" fill="#ECEFF4" font-size="17">времени. Вслед за ним</text>
<text x="506.0" y="254" fill="#ECEFF4" font-size="17">смещались зоны</text>
<text x="506.0" y="278" fill="#ECEFF4" font-size="17">улучшенных</text>
<rect x="715.0" y="100" width="205.0" height="340" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="731.0" y="130" fill="#3498DB" font-size="18" font-weight="700">Этап 4</text>
<text x="731.0" y="158" fill="#ECEFF4" font-size="17">Рис. 10.5 показывает</text>
<text x="731.0" y="182" fill="#ECEFF4" font-size="17">профиль фаций и</text>
<text x="731.0" y="206" fill="#ECEFF4" font-size="17">распределение</text>
<text x="731.0" y="230" fill="#ECEFF4" font-size="17">коллекторов. В легенде</text>
<text x="731.0" y="254" fill="#ECEFF4" font-size="17">есть биогермные,</text>
<text x="731.0" y="278" fill="#ECEFF4" font-size="17">шлейфовые, баровые,</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 209, 211</text>
</svg>