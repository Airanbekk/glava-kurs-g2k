<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Какие бывают залежи и их высота</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<rect x="32" y="100" width="280" height="340" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="48" y="130" fill="#3498DB" font-size="18" font-weight="700">Признаки</text>
<text x="48" y="158" fill="#ECEFF4" font-size="17">тип рифа (куполовидный,</text>
<text x="48" y="182" fill="#ECEFF4" font-size="17">плосковершинный, атолловидный,</text>
<text x="48" y="206" fill="#ECEFF4" font-size="17">асимметричный краевой,</text>
<text x="48" y="230" fill="#ECEFF4" font-size="17">асимметричный барьерный);</text>
<text x="48" y="254" fill="#ECEFF4" font-size="17">наличие латерального</text>
<text x="48" y="278" fill="#ECEFF4" font-size="17">непроницаемого экрана;</text>
<line x1="316" y1="270" x2="346" y2="270" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="350" y="100" width="280" height="340" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="366" y="130" fill="#F1C40F" font-size="18" font-weight="700">Правило</text>
<text x="366" y="158" fill="#ECEFF4" font-size="17">Верхний предел высоты залежи:</text>
<text x="366" y="182" fill="#ECEFF4" font-size="17">превышение рифа над внерифовыми</text>
<text x="366" y="206" fill="#ECEFF4" font-size="17">или зарифовыми отложениями —</text>
<text x="366" y="230" fill="#ECEFF4" font-size="17">без экрана. Почти полная</text>
<text x="366" y="254" fill="#ECEFF4" font-size="17">мощность рифа — при латеральном</text>
<text x="366" y="278" fill="#ECEFF4" font-size="17">экране. Тектоника увеличивает</text>
<line x1="634" y1="270" x2="664" y2="270" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="668" y="100" width="260" height="200" rx="14" fill="#1A2129" stroke="#2E8B57" stroke-width="3"/>
<text x="684" y="130" fill="#2E8B57" font-size="18" font-weight="700">Вывод</text>
<text x="684" y="158" fill="#ECEFF4" font-size="17">Тип ловушки даёт верхнюю</text>
<text x="684" y="182" fill="#ECEFF4" font-size="17">границу нефтенасыщенной</text>
<text x="684" y="206" fill="#ECEFF4" font-size="17">мощности, а не её точное</text>
<text x="684" y="230" fill="#ECEFF4" font-size="17">значение.</text>
<rect x="668" y="312" width="260" height="128" rx="14" fill="#1A2129" stroke="#E74C3C" stroke-width="3"/>
<text x="684" y="342" fill="#E74C3C" font-size="18" font-weight="700">Контрпример</text>
<text x="684" y="370" fill="#ECEFF4" font-size="17">В асимметричном барьерном</text>
<text x="684" y="394" fill="#ECEFF4" font-size="17">рифе с непроницаемыми</text>
<text x="684" y="418" fill="#ECEFF4" font-size="17">лагунными отложениями высота</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 219, 220</text>
</svg>