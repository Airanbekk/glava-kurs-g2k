<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Прямые признаки коллектора на кривых</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<rect x="32" y="100" width="280" height="330" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="48" y="130" fill="#F1C40F" font-size="18" font-weight="700">Причина / механизм</text>
<text x="48" y="158" fill="#ECEFF4" font-size="17">В проницаемом пласте фильтрат</text>
<text x="48" y="182" fill="#ECEFF4" font-size="17">раствора уходит в поры, а на</text>
<text x="48" y="206" fill="#ECEFF4" font-size="17">стенке остаётся глинистая</text>
<text x="48" y="230" fill="#ECEFF4" font-size="17">корка. Корка сужает ствол и</text>
<text x="48" y="254" fill="#ECEFF4" font-size="17">меняет показания микрозондов.</text>
<text x="48" y="278" fill="#ECEFF4" font-size="17">Фильтрат вытесняет пластовый</text>
<line x1="316" y1="265" x2="346" y2="265" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="350" y="100" width="280" height="330" rx="14" fill="#1A2129" stroke="#2E8B57" stroke-width="3"/>
<text x="366" y="130" fill="#2E8B57" font-size="18" font-weight="700">Следствие</text>
<text x="366" y="158" fill="#ECEFF4" font-size="17">Коллектор отличается от</text>
<text x="366" y="182" fill="#ECEFF4" font-size="17">неколлектора проницаемостью,</text>
<text x="366" y="206" fill="#ECEFF4" font-size="17">пористостью и глинистостью.</text>
<text x="366" y="230" fill="#ECEFF4" font-size="17">Прямые признаки — сужение</text>
<text x="366" y="254" fill="#ECEFF4" font-size="17">ствола, положительные</text>
<text x="366" y="278" fill="#ECEFF4" font-size="17">приращения микрозондов и зона</text>
<line x1="634" y1="265" x2="664" y2="265" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="668" y="100" width="260" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="684" y="130" fill="#3498DB" font-size="18" font-weight="700">Как используют</text>
<text x="684" y="158" fill="#ECEFF4" font-size="17">Интерпретатор смотрит на</text>
<text x="684" y="182" fill="#ECEFF4" font-size="17">каверномер (диаметр ствола),</text>
<text x="684" y="206" fill="#ECEFF4" font-size="17">микрозонды разной глубины и</text>
<text x="684" y="230" fill="#ECEFF4" font-size="17">зонды разной глубинности</text>
<text x="684" y="254" fill="#ECEFF4" font-size="17">(БЭЗ, БК и МБК). Он сверяется</text>
<text x="684" y="278" fill="#ECEFF4" font-size="17">с табл. 21 и учитывает</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 96</text>
</svg>