<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Что решают ГИС в скважине</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<rect x="32.0" y="110" width="206.0" height="330" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="48.0" y="140" fill="#F1C40F" font-size="18" font-weight="700">Шаг 1</text>
<text x="48.0" y="168" fill="#ECEFF4" font-size="17">Построить</text>
<text x="48.0" y="192" fill="#ECEFF4" font-size="17">литологический разрез</text>
<text x="48.0" y="216" fill="#ECEFF4" font-size="17">по признакам основных</text>
<text x="48.0" y="240" fill="#ECEFF4" font-size="17">типов пород на главных</text>
<text x="48.0" y="264" fill="#ECEFF4" font-size="17">диаграммах комплекса.</text>
<line x1="240.0" y1="275" x2="260.0" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="262.0" y="110" width="206.0" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="278.0" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 2</text>
<text x="278.0" y="168" fill="#ECEFF4" font-size="17">Выделить коллекторы и</text>
<text x="278.0" y="192" fill="#ECEFF4" font-size="17">оценить характер их</text>
<text x="278.0" y="216" fill="#ECEFF4" font-size="17">насыщения. Определить</text>
<text x="278.0" y="240" fill="#ECEFF4" font-size="17">эффективную толщину:</text>
<text x="278.0" y="264" fill="#ECEFF4" font-size="17">качественно для</text>
<text x="278.0" y="288" fill="#ECEFF4" font-size="17">простейшего</text>
<line x1="470.0" y1="275" x2="490.0" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="492.0" y="110" width="206.0" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="508.0" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 3</text>
<text x="508.0" y="168" fill="#ECEFF4" font-size="17">Получить пористость,</text>
<text x="508.0" y="192" fill="#ECEFF4" font-size="17">нефтегазонасыщение и</text>
<text x="508.0" y="216" fill="#ECEFF4" font-size="17">проницаемость для</text>
<text x="508.0" y="240" fill="#ECEFF4" font-size="17">промышленной оценки,</text>
<text x="508.0" y="264" fill="#ECEFF4" font-size="17">подсчёта запасов и</text>
<text x="508.0" y="288" fill="#ECEFF4" font-size="17">проектирования</text>
<line x1="700.0" y1="275" x2="720.0" y2="275" stroke="#8A96A3" stroke-width="4" marker-end="url(#ah)"/>
<rect x="722.0" y="110" width="206.0" height="330" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="738.0" y="140" fill="#3498DB" font-size="18" font-weight="700">Шаг 4</text>
<text x="738.0" y="168" fill="#ECEFF4" font-size="17">В эксплуатационных</text>
<text x="738.0" y="192" fill="#ECEFF4" font-size="17">скважинах дополнительно</text>
<text x="738.0" y="216" fill="#ECEFF4" font-size="17">устанавливать</text>
<text x="738.0" y="240" fill="#ECEFF4" font-size="17">продвижение ВНК и ГЖК в</text>
<text x="738.0" y="264" fill="#ECEFF4" font-size="17">ходе разработки.</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 90</text>
</svg>