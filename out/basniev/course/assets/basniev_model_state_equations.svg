<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Из чего собрана модель фильтрации</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<rect x="32" y="96" width="896" height="120" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="48" y="126" fill="#F1C40F" font-size="18" font-weight="700">Что считает формула</text>
<text x="48" y="154" fill="#ECEFF4" font-size="19">Исходная система (23.8): неразрывность, закон Дарси и зависимость свойств от давления.</text>
<text x="48" y="236" fill="#3498DB" font-size="20" font-weight="700">m</text><text x="210" y="236" fill="#ECEFF4" font-size="19">пористость , доли ед.</text>
<text x="48" y="272" fill="#3498DB" font-size="20" font-weight="700">\rho</text><text x="210" y="272" fill="#ECEFF4" font-size="19">плотность жидкости , кг/м³</text>
<text x="48" y="308" fill="#3498DB" font-size="20" font-weight="700">\bar{w}</text><text x="210" y="308" fill="#ECEFF4" font-size="19">скорость фильтрации , м/с</text>
<text x="48" y="344" fill="#3498DB" font-size="20" font-weight="700">k</text><text x="210" y="344" fill="#ECEFF4" font-size="19">проницаемость , м²</text>
<text x="48" y="380" fill="#3498DB" font-size="20" font-weight="700">\mu</text><text x="210" y="380" fill="#ECEFF4" font-size="19">динамическая вязкость , Па·с</text>
<text x="48" y="416" fill="#3498DB" font-size="20" font-weight="700">p</text><text x="210" y="416" fill="#ECEFF4" font-size="19">давление , Па</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 478, 479</text>
