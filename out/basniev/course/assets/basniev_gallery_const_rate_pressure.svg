<text x="48" y="126" fill="#F1C40F" font-size="18" font-weight="700">Что считает формула</text>
<text x="48" y="154" fill="#ECEFF4" font-size="19">Давление в любой точке потока к галерее при постоянной скорости фильтрации на галерее</text>
<text x="48" y="180" fill="#ECEFF4" font-size="19">(23.38).</text>
