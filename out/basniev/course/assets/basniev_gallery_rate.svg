<text x="48" y="416" fill="#3498DB" font-size="20" font-weight="700">\kappa</text><text x="210" y="416" fill="#ECEFF4" font-size="19">коэффициент пьезопроводности , не указана автором в узле</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 484, 485</text>
