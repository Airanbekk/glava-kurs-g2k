<text x="48" y="126" fill="#F1C40F" font-size="18" font-weight="700">Что считает формула</text>
<text x="48" y="154" fill="#ECEFF4" font-size="19">Дебит галереи в момент t при постоянном давлении на ней</text>
<text x="48" y="236" fill="#3498DB" font-size="20" font-weight="700">Q</text><text x="210" y="236" fill="#ECEFF4" font-size="19">дебит галереи , не указана автором в узле</text>
<text x="48" y="272" fill="#3498DB" font-size="20" font-weight="700">k</text><text x="210" y="272" fill="#ECEFF4" font-size="19">проницаемость пласта , не указана автором в узле</text>
<text x="48" y="308" fill="#3498DB" font-size="20" font-weight="700">\mu</text><text x="210" y="308" fill="#ECEFF4" font-size="19">вязкость жидкости , не указана автором в узле</text>
