<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A96A3"/></marker></defs>
<rect width="960" height="540" fill="#0F1419"/>
<text x="32" y="46" fill="#ECEFF4" font-size="26" font-weight="700">Линии времени против границ пород</text>
<rect x="788" y="20" width="150" height="36" rx="18" fill="#8E44AD"/>
<text x="863" y="44" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">схема</text>
<line x1="40" y1="470" x2="920" y2="470" stroke="#8A96A3" stroke-width="3" marker-end="url(#ah)"/>
<text x="800" y="500" fill="#8A96A3" font-size="16">время →</text>
<rect x="40.0" y="100" width="205.0" height="340" rx="14" fill="#1A2129" stroke="#F1C40F" stroke-width="3"/>
<text x="56.0" y="130" fill="#F1C40F" font-size="18" font-weight="700">Этап 1</text>
<text x="56.0" y="158" fill="#ECEFF4" font-size="17">Клиноформа — наклонная</text>
<text x="56.0" y="182" fill="#ECEFF4" font-size="17">поверхность в дельте.</text>
<text x="56.0" y="206" fill="#ECEFF4" font-size="17">Автор называет</text>
<text x="56.0" y="230" fill="#ECEFF4" font-size="17">клиноформы линиями</text>
<text x="56.0" y="254" fill="#ECEFF4" font-size="17">времени: каждая</text>
<text x="56.0" y="278" fill="#ECEFF4" font-size="17">отмечает один момент.</text>
<rect x="265.0" y="100" width="205.0" height="340" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="281.0" y="130" fill="#3498DB" font-size="18" font-weight="700">Этап 2</text>
<text x="281.0" y="158" fill="#ECEFF4" font-size="17">Корреляция — это</text>
<text x="281.0" y="182" fill="#ECEFF4" font-size="17">сопоставление пластов</text>
<text x="281.0" y="206" fill="#ECEFF4" font-size="17">между скважинами. Автор</text>
<text x="281.0" y="230" fill="#ECEFF4" font-size="17">показывает два способа:</text>
<text x="281.0" y="254" fill="#ECEFF4" font-size="17">по литофациям и по</text>
<text x="281.0" y="278" fill="#ECEFF4" font-size="17">времени. Литофации —</text>
<rect x="490.0" y="100" width="205.0" height="340" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="506.0" y="130" fill="#3498DB" font-size="18" font-weight="700">Этап 3</text>
<text x="506.0" y="158" fill="#ECEFF4" font-size="17">Если сопоставить пески</text>
<text x="506.0" y="182" fill="#ECEFF4" font-size="17">по схожему каротажу,</text>
<text x="506.0" y="206" fill="#ECEFF4" font-size="17">они кажутся</text>
<text x="506.0" y="230" fill="#ECEFF4" font-size="17">непрерывными. По</text>
<text x="506.0" y="254" fill="#ECEFF4" font-size="17">подписи к рисунку так</text>
<text x="506.0" y="278" fill="#ECEFF4" font-size="17">выглядит</text>
<rect x="715.0" y="100" width="205.0" height="340" rx="14" fill="#1A2129" stroke="#3498DB" stroke-width="3"/>
<text x="731.0" y="130" fill="#3498DB" font-size="18" font-weight="700">Этап 4</text>
<text x="731.0" y="158" fill="#ECEFF4" font-size="17">На разрезе скважины</text>
<text x="731.0" y="182" fill="#ECEFF4" font-size="17">стоят в 500 м друг от</text>
<text x="731.0" y="206" fill="#ECEFF4" font-size="17">друга. Пески устьевых</text>
<text x="731.0" y="230" fill="#ECEFF4" font-size="17">баров — отдельные тела,</text>
<text x="731.0" y="254" fill="#ECEFF4" font-size="17">которые утоняются,</text>
<text x="731.0" y="278" fill="#ECEFF4" font-size="17">расщепляются и</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 410</text>
</svg>