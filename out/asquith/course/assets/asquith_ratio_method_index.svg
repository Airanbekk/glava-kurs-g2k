<text x="48" y="126" fill="#F1C40F" font-size="18" font-weight="700">Что считает формула</text>
<text x="48" y="154" fill="#ECEFF4" font-size="19">Квадрат индекса равен отношению двух отношений сопротивлений (уравнение 7.3).</text>
<text x="48" y="236" fill="#3498DB" font-size="20" font-weight="700">S_w</text><text x="210" y="236" fill="#ECEFF4" font-size="19">водонасыщенность незатронутой зоны , доли ед.</text>
<text x="48" y="272" fill="#3498DB" font-size="20" font-weight="700">S_{xo}</text><text x="210" y="272" fill="#ECEFF4" font-size="19">водонасыщенность промытой зоны , доли ед.</text>
<text x="48" y="308" fill="#3498DB" font-size="20" font-weight="700">R_{xo}</text><text x="210" y="308" fill="#ECEFF4" font-size="19">сопротивление промытой зоны по мелкому прибору , Ом·м</text>
<text x="48" y="344" fill="#3498DB" font-size="20" font-weight="700">R_t</text><text x="210" y="344" fill="#ECEFF4" font-size="19">истинное сопротивление пласта , Ом·м</text>
<text x="48" y="380" fill="#3498DB" font-size="20" font-weight="700">R_{mf}</text><text x="210" y="380" fill="#ECEFF4" font-size="19">сопротивление фильтрата раствора при пластовой температуре , Ом·м</text>
<text x="48" y="416" fill="#3498DB" font-size="20" font-weight="700">R_w</text><text x="210" y="416" fill="#ECEFF4" font-size="19">сопротивление пластовой воды при пластовой температуре , Ом·м</text>
<text x="32" y="524" fill="#8A96A3" font-size="14">по главе, стр. 127</text>
